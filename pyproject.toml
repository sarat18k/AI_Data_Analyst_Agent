[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-analyst"
version = "0.1.0"
description = "A guarded natural-language data analysis agent using OpenAI, DuckDB, and Streamlit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.3",
    "openai>=1.51.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "python-dotenv>=1.0.1",
    "sqlglot>=25.0.0",
    "statsmodels>=0.14.4",
    "streamlit>=1.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
